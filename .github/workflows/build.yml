name: Build

# PR CI only — production deploy is `.github/workflows/deploy-pages.yml` on main.
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Desk
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Desk deps
        run: npm ci

      - name: Fetch evidence-graph dump
        run: npm run fetch-dump

      - name: Check dump refs (ED-16)
        run: npm run check:dump

      - name: Build static site
        # Invoke astro directly so npm's prebuild (fetch-dump) does not run twice.
        run: npx astro build

      - name: Smoke-check dist entity/claim pages (ED-16)
        run: npm run check:dist

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: evidence-desk-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
